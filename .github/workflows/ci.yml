# CI for the Pombus MCP server client. Build + typecheck + test on every push and PR.
# No secrets, no publish, no deploy — just proves the package stays green for anyone who clones it.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install (from the committed lockfile)
        run: npm ci
      - name: Test (builds, then runs the node:test suite)
        run: npm test
