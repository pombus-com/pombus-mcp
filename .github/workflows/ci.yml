# CI for the Pombus MCP server client. Build + typecheck + test on every push and PR.
# No secrets, no publish, no deploy — just proves the package stays green for anyone who clones it.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install (from the committed lockfile)
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test (builds, then runs the node:test suite)
        run: npm test
