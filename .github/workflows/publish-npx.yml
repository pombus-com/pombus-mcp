# Publishes the `pombus` package to npm from THIS public repo, with provenance.
# Auth is npm Trusted Publishing (OIDC): no npm token is stored anywhere. The npm side trusts exactly
# pombus-com/pombus-mcp + this file + the `npm` environment, and that environment requires the
# founder's approval and only runs from main. Manual trigger only: a release is a decision, not a push.
name: Publish to npm

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write # the OIDC token npm exchanges for a one-shot publish credential
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: npm with Trusted Publishing support (>= 11.5.1)
        run: npm install -g npm@11.6.2
      - name: Install (from the committed lockfile)
        run: npm ci
      - name: Test (builds dist/ with the full tsc, then runs the node:test suite)
        run: npm test
      # Trusted Publishing implies provenance; npm itself refuses (E403) a version that already exists.
      - name: Publish
        run: npm publish
