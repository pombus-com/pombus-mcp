# Publishes the `pombus` package to npm from THIS public repo, with provenance.
# Auth is npm Trusted Publishing (OIDC): no npm token is stored anywhere. The npm side trusts exactly
# pombus-com/pombus-mcp + this file + the `npm` environment, and that environment requires the
# founder's approval and only runs from main. Manual trigger only: a release is a decision, not a push.
#
# Two jobs (pombus-sec SHOULD-2, #369): `build` installs the dependencies and runs their code (npm ci,
# tsc, the tests) WITHOUT the OIDC permission, and hands the packed tarball over as an artifact. Only
# `publish` can mint the npm credential, and it runs no dependency code: it publishes that tarball.
name: Publish to npm

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install (from the committed lockfile)
        run: npm ci
      - name: Test (builds dist/ with the full tsc, then runs the node:test suite)
        run: npm test
      - name: Pack the exact tarball that will be published
        run: npm pack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tarball
          path: pombus-*.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write # the OIDC token npm exchanges for a one-shot publish credential
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tarball
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: npm with Trusted Publishing support (>= 11.5.1)
        run: npm install -g npm@11.6.2
      # Trusted Publishing implies provenance; npm itself refuses (E403) a version that already exists.
      # `--ignore-scripts`: publishing a tarball runs no lifecycle script from it.
      - name: Publish
        run: npm publish --ignore-scripts ./pombus-*.tgz
